name: Daily US Stock

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

# 加入這行：給機器人寫入網頁檔案的權限！
permissions:
  contents: write

jobs:
  run-system:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: pip install -r requirements.txt
    
    - name: 執行美股系統
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: python main.py
      
    - name: 🌐 將新生成的網頁存檔並上傳
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add index.html
        git commit -m "自動更新網頁版報告" || echo "無變化"
        git push
